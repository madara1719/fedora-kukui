jobs:
  rootfs:
    runs-on: ubuntu-24.04-arm
    container:
      image: fedora:44

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          uname -a
          echo "Architecture:"
          uname -m
          echo "Fedora:"
          cat /etc/fedora-release

      - name: Install build tools and vboot-utils
        run: |
          dnf -y install \
            bash \
            coreutils \
            dnf \
            findutils \
            grep \
            sed \
            rsync \
            tar \
            xz \
            ca-certificates \
            vboot-utils  # <-- ESTE PAQUETE CONTIENE LAS CLAVES EN FEDORA

      - name: Fetch and build kernel
        env:
          # Apuntamos al directorio que vboot-utils instala en Fedora
          DEVKEYS_DIR: /usr/share/vboot/devkeys
        run: |
          chmod +x kernel/fetch.sh
          ./kernel/fetch.sh

      - name: Build Fedora rootfs
        run: |
          chmod +x fedora/rootfs.sh
          ./fedora/rootfs.sh

      - name: Archive rootfs
        run: |
          mkdir -p build/artifacts
          tar \
            --numeric-owner \
            --xattrs \
            --acls \
            -C build/rootfs \
            -cJf build/artifacts/fedora-kukui-rootfs.tar.xz \
            .

      - name: Package kernel
        run: |
          mkdir -p build/kernel-artifact
          cp kernel/build/vmlinux.kpart build/kernel-artifact/
          cp -a kernel/build/modules build/kernel-artifact/

      - name: Upload rootfs
        uses: actions/upload-artifact@v4
        with:
          name: fedora-kukui-rootfs
          path: build/artifacts/fedora-kukui-rootfs.tar.xz
          if-no-files-found: error

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: fedora-kukui-kernel
          path: build/kernel-artifact
          if-no-files-found: error
