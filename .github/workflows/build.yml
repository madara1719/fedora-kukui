name: Build Fedora Kukui

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  rootfs:
    runs-on: ubuntu-24.04-arm
    container:
      image: fedora:44

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          uname -a
          echo "Architecture:"
          uname -m
          echo "Fedora:"
          cat /etc/fedora-release

      - name: Install build tools, vboot-utils, dracut and depthcharge-tools
        run: |
          dnf -y install \
            bash \
            coreutils \
            findutils \
            grep \
            sed \
            rsync \
            tar \
            xz \
            ca-certificates \
            vboot-utils \
            dracut \
            kmod \
            dtc \
            uboot-tools \
            python3-pip \
            python3-setuptools
           
           pip3 install --break-system-packages depthcharge-tools

          echo "=== Tool verification ==="
          command -v vbutil_kernel
          command -v dracut
          command -v dtc
          command -v mkimage
          command -v mkdepthcharge
          mkdepthcharge --help || true
      - name: Fetch and build kernel
        env:
          DEVKEYS_DIR: /usr/share/vboot/devkeys
        run: |
          chmod +x kernel/fetch.sh
          ./kernel/fetch.sh

      - name: Build Fedora rootfs
        run: |
          chmod +x fedora/rootfs.sh
          ./fedora/rootfs.sh

      - name: Archive rootfs
        run: |
          mkdir -p build/artifacts
          tar \
            --numeric-owner \
            --xattrs \
            --acls \
            -C build/rootfs \
            -cJf build/artifacts/fedora-kukui-rootfs.tar.xz \
            .

      - name: Package kernel
        run: |
          mkdir -p build/kernel-artifact
          cp kernel/build/vmlinux.kpart build/kernel-artifact/
          cp -a kernel/build/modules build/kernel-artifact/

      - name: Upload rootfs
        uses: actions/upload-artifact@v4
        with:
          name: fedora-kukui-rootfs
          path: build/artifacts/fedora-kukui-rootfs.tar.xz
          if-no-files-found: error

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: fedora-kukui-kernel
          path: build/kernel-artifact
          if-no-files-found: error

  image:
    needs: rootfs
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cgpt btrfs-progs e2fsprogs rsync xz-utils util-linux kpartx

      - name: Download rootfs
        uses: actions/download-artifact@v4
        with:
          name: fedora-kukui-rootfs
          path: build/rootfs-archive

      - name: Download kernel
        uses: actions/download-artifact@v4
        with:
          name: fedora-kukui-kernel
          path: build/kernel

      - name: Extract rootfs
        run: |
          mkdir -p build/rootfs
          tar \
            --numeric-owner \
            --xattrs \
            --acls \
            -xJf \
            build/rootfs-archive/fedora-kukui-rootfs.tar.xz \
            -C build/rootfs

      - name: Verify kernel
        run: |
          # Nota: El hash SHA256 ahora será DIFERENTE porque es el kernel de 
          # postmarketOS empaquetado y firmado con nuestras propias devkeys.
          # Verificamos simplemente que el archivo exista y tenga tamaño > 0.
          test -s build/kernel/vmlinux.kpart
          echo "Kernel file exists and is not empty."
          ls -lh build/kernel/vmlinux.kpart

      - name: Build image
        run: |
          chmod +x scripts/build-image.sh
          sudo IMAGE_SIZE=6G ./scripts/build-image.sh

      - name: Validate image
        run: |
          sudo cgpt show build/image/fedora-kukui.img
          echo "KernelA:"
          sudo dd if=build/image/fedora-kukui.img bs=512 skip=8192 count=38456 status=none | sha256sum
          echo "KernelB:"
          sudo dd if=build/image/fedora-kukui.img bs=512 skip=270336 count=38456 status=none | sha256sum
          ls -lh build/image/fedora-kukui.img

      - name: Fix image permissions
        run: |
          sudo chown "${USER}:${USER}" build/image/fedora-kukui.img

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: fedora-kukui-image
          path: build/image/fedora-kukui.img
          if-no-files-found: error
