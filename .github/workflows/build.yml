name: Build Fedora Kukui

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  rootfs:
    runs-on: ubuntu-24.04-arm

    container:
      image: fedora:44

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          uname -a
          echo "Architecture:"
          uname -m
          echo "Fedora:"
          cat /etc/fedora-release

      - name: Install build tools
        run: |
          dnf -y install \
            bash \
            coreutils \
            dnf \
            findutils \
            grep \
            sed \
            rsync \
            tar \
            xz \
            ca-certificates
       
      - name: Fetch kernel
        run: |
          chmod +x kernel/fetch.sh
          ./kernel/fetch.sh

      - name: Build Fedora rootfs
        run: |
          chmod +x fedora/rootfs.sh
          ./fedora/rootfs.sh

      - name: Install vboot-utils (for kernel signing)
        run: sudo apt-get update && sudo apt-get install -y vboot-utils

      - name: Fetch and build kernel
        env:  
        
          DEVKEYS_DIR: /usr/share/vboot/devkeys
        run: |
            chmod +x kernel/fetch.sh
            ./kernel/fetch.sh

      - name: Archive rootfs
        run: |
          mkdir -p build/artifacts

          tar \
            --numeric-owner \
            --xattrs \
            --acls \
            -C build/rootfs \
            -cJf build/artifacts/fedora-kukui-rootfs.tar.xz \
            .

      - name: Package kernel
        run: |
          mkdir -p build/kernel-artifact

          cp \
            kernel/build/vmlinux.kpart \
            build/kernel-artifact/

          cp -a \
            kernel/build/modules \
            build/kernel-artifact/

      - name: Upload rootfs
        uses: actions/upload-artifact@v4
        with:
          name: fedora-kukui-rootfs
          path: build/artifacts/fedora-kukui-rootfs.tar.xz
          if-no-files-found: error

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: fedora-kukui-kernel
          path: build/kernel-artifact
          if-no-files-found: error

  image:
    needs: rootfs
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cgpt btrfs-progs e2fsprogs rsync xz-utils util-linux kpartx

      - name: Download rootfs
        uses: actions/download-artifact@v4
        with:
          name: fedora-kukui-rootfs
          path: build/rootfs-archive

      - name: Download kernel
        uses: actions/download-artifact@v4
        with:
          name: fedora-kukui-kernel
          path: build/kernel

      - name: Extract rootfs
        run: |
          mkdir -p build/rootfs

          tar \
            --numeric-owner \
            --xattrs \
            --acls \
            -xJf \
            build/rootfs-archive/fedora-kukui-rootfs.tar.xz \
            -C build/rootfs

      - name: Verify kernel
        run: |
         sha256sum build/kernel/vmlinux.kpart

         test \
           "$(sha256sum build/kernel/vmlinux.kpart | awk '{print $1}')" \
          = \
         "39c486a5ad5ba5f348255fecd47e71d2359d15641d897058f0a87f51658764c6"

      - name: Build image
        run: |
          chmod +x scripts/build-image.sh

          sudo \
            IMAGE_SIZE=6G \
            ./scripts/build-image.sh

      - name: Validate image
        run: |
          sudo cgpt show build/image/fedora-kukui.img

          echo "KernelA:"
          sudo dd \
            if=build/image/fedora-kukui.img \
            bs=512 \
            skip=8192 \
            count=38456 \
            status=none |
            sha256sum

          echo "KernelB:"
          sudo dd \
            if=build/image/fedora-kukui.img \
            bs=512 \
            skip=270336 \
            count=38456 \
            status=none |
            sha256sum

          ls -lh build/image/fedora-kukui.img

      - name: Fix image permissions
        run: |
          sudo chown "${USER}:${USER}" build/image/fedora-kukui.img

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: fedora-kukui-image
          path: build/image/fedora-kukui.img
          if-no-files-found: error
